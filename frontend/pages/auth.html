<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticate | BoardPrep AI 2.0</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f8fafc',
              100: '#f1f5f9',
              500: '#4f46e5',
              600: '#4338ca',
              secondary: '#8b5cf6',
              accent: '#06b6d4',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase Client Web SDK CDNs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#030712] dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-300 font-sans antialiased">

  <!-- Sticky Navbar -->
  <nav class="border-b border-slate-200 dark:border-gray-900 bg-white/80 dark:bg-gray-950/80 backdrop-blur-md sticky top-0 z-50 transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center space-x-2 group">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-500 to-brand-secondary flex items-center justify-center font-bold text-base text-white">B</div>
        <span class="font-extrabold tracking-tight text-slate-900 dark:text-white">BoardPrep AI</span>
      </a>
      <a href="../index.html" class="text-xs font-bold text-slate-500 hover:text-brand-500 dark:text-gray-400 dark:hover:text-white transition-colors">Back to Home</a>
    </div>
  </nav>

  <!-- Main Card Wrapper -->
  <main class="max-w-md w-full mx-auto px-4 py-12 flex-grow flex items-center justify-center">
    <div class="glass p-8 rounded-3xl border border-slate-200 dark:border-gray-900 w-full relative glow-effect overflow-hidden shadow-xl shadow-brand-500/5">

      <!-- Tabs (Login vs SignUp) -->
      <div class="flex border-b border-slate-200 dark:border-gray-800/80 mb-6">
        <button id="tab-login" class="flex-1 pb-3 text-center text-sm font-bold border-b-2 border-brand-500 text-slate-900 dark:text-white" onclick="switchAuthTab('login')">Sign In</button>
        <button id="tab-signup" class="flex-1 pb-3 text-center text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>

      <!-- Auth Error Container -->
      <div id="auth-error-box" class="hidden mb-4 p-4 bg-brand-danger/10 border border-brand-danger/30 text-brand-danger rounded-xl text-xs font-bold"></div>

      <!-- Main Form -->
      <form id="auth-form" class="space-y-4">

        <!-- Full Name Field (SignUp only) -->
        <div id="field-name" class="hidden relative">
          <label class="block text-xs font-bold uppercase text-slate-500 dark:text-gray-400 mb-1">Full Name</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">👤</span>
            <input type="text" id="auth-name" class="w-full bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-lg pl-10 pr-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="Ali Raza">
          </div>
        </div>

        <!-- WhatsApp Number Field (SignUp only) -->
        <div id="field-whatsapp" class="hidden relative">
          <label class="block text-xs font-bold uppercase text-slate-500 dark:text-gray-400 mb-1">WhatsApp Number</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">💬</span>
            <input type="text" id="auth-whatsapp" class="w-full bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-lg pl-10 pr-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="+923001234567">
          </div>
        </div>

        <!-- Email Address -->
        <div class="relative">
          <label class="block text-xs font-bold uppercase text-slate-500 dark:text-gray-400 mb-1">Email Address</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">✉️</span>
            <input type="email" id="auth-email" required class="w-full bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-lg pl-10 pr-4 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="student@example.com">
          </div>
        </div>

        <!-- Password Field with eye toggler and strength meter -->
        <div class="relative">
          <label class="block text-xs font-bold uppercase text-slate-500 dark:text-gray-400 mb-1">Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">🔑</span>
            <input type="password" id="auth-password" required class="w-full bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-lg pl-10 pr-12 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="••••••••">
            <button type="button" id="toggle-pwd" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Live Password Strength Criteria Indicators (SignUp only) -->
        <div id="password-strength-section" class="hidden space-y-2 p-3 bg-slate-100 dark:bg-gray-900/60 rounded-xl border border-slate-200 dark:border-gray-800/80">
          <div class="text-[10px] font-bold uppercase text-slate-500">Password Strength Criteria:</div>
          <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-[10px] font-semibold text-slate-400">
            <div id="crit-len" class="flex items-center gap-1">✕ Min 8 characters</div>
            <div id="crit-upper" class="flex items-center gap-1">✕ One uppercase</div>
            <div id="crit-lower" class="flex items-center gap-1">✕ One lowercase</div>
            <div id="crit-num" class="flex items-center gap-1">✕ One number</div>
            <div id="crit-special" class="flex items-center gap-1">✕ One special char</div>
          </div>
          <!-- Bar meter -->
          <div class="w-full bg-slate-200 dark:bg-gray-800 h-1 rounded-full overflow-hidden">
            <div id="pwd-meter-bar" class="w-0 h-full bg-brand-danger transition-all duration-300"></div>
          </div>
        </div>

        <!-- Confirm Password Field (SignUp only) -->
        <div id="field-confirm-pwd" class="hidden relative">
          <label class="block text-xs font-bold uppercase text-slate-500 dark:text-gray-400 mb-1">Confirm Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">🛡️</span>
            <input type="password" id="auth-confirm-password" class="w-full bg-white dark:bg-gray-900 border border-slate-200 dark:border-gray-800 rounded-lg pl-10 pr-12 py-3 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-brand-500 transition-colors" placeholder="••••••••">
            <button type="button" id="toggle-confirm-pwd" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white" aria-label="Toggle confirm password visibility">👁️</button>
          </div>
          <div id="confirm-pwd-match-text" class="text-[10px] font-bold mt-1 text-slate-400"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit" class="w-full py-3.5 bg-gradient-to-r from-brand-500 to-brand-secondary hover:from-brand-600 hover:to-brand-secondary/90 text-sm font-bold rounded-xl text-white shadow-lg shadow-brand-500/10 transition-all transform hover:-translate-y-0.5">
          Sign In
        </button>
      </form>

      <div class="mt-6 border-t border-slate-200 dark:border-gray-900 pt-4 text-center">
        <p class="text-xs text-slate-500">By continuing, you agree to our <a href="terms.html" class="text-slate-400 hover:underline">Terms of Service</a> & <a href="privacy.html" class="text-slate-400 hover:underline font-semibold">Privacy Policy</a>.</p>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 dark:border-gray-900 py-6 text-center text-xs text-slate-500 dark:text-gray-600 transition-colors duration-300">
    &copy; 2024–2025 BoardPrep AI 2.0. All rights reserved.
  </footer>

  <script src="../assets/js/app.js"></script>
  <script>
    // Color theme synchronization
    const localModeKey = "boardprep_color_theme";
    const storedTheme = localStorage.getItem(localModeKey);
    if (storedTheme === "dark" || (!storedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.body.classList.add("dark");
    }

    // Config Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyFakeKeySecureClientSaaSOnly",
      authDomain: "boardprep-ai.firebaseapp.com",
      projectId: "boardprep-ai",
      storageBucket: "boardprep-ai.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    let currentMode = "login";

    // Auto-redirect session check (Redirect away from auth.html back to dashboard if authenticated)
    auth.onAuthStateChanged((user) => {
      if (user && user.emailVerified) {
        window.location.href = "dashboard.html";
      }
    });

    // Determine initial form screen tab
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode");
      if (mode === "signup") {
        switchAuthTab("signup");
      } else {
        switchAuthTab("login");
      }
    });

    function switchAuthTab(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById("tab-login");
      const tabSignup = document.getElementById("tab-signup");
      const fieldName = document.getElementById("field-name");
      const fieldWhatsApp = document.getElementById("field-whatsapp");
      const fieldConfirmPwd = document.getElementById("field-confirm-pwd");
      const pwdStrengthSec = document.getElementById("password-strength-section");
      const btnSubmit = document.getElementById("btn-submit");

      if (mode === "signup") {
        tabLogin.className = "flex-1 pb-3 text-center text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all";
        tabSignup.className = "flex-1 pb-3 text-center text-sm font-bold border-b-2 border-brand-500 text-slate-900 dark:text-white";
        fieldName.classList.remove("hidden");
        fieldWhatsApp.classList.remove("hidden");
        fieldConfirmPwd.classList.remove("hidden");
        pwdStrengthSec.classList.remove("hidden");
        btnSubmit.textContent = "Create Account";
        document.getElementById("auth-confirm-password").required = true;
      } else {
        tabLogin.className = "flex-1 pb-3 text-center text-sm font-bold border-b-2 border-brand-500 text-slate-900 dark:text-white";
        tabSignup.className = "flex-1 pb-3 text-center text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all";
        fieldName.classList.add("hidden");
        fieldWhatsApp.classList.add("hidden");
        fieldConfirmPwd.classList.add("hidden");
        pwdStrengthSec.classList.add("hidden");
        btnSubmit.textContent = "Sign In";
        document.getElementById("auth-confirm-password").required = false;
      }
    }

    // Toggle password visibility
    const pwdInput = document.getElementById("auth-password");
    const togglePwdBtn = document.getElementById("toggle-pwd");
    togglePwdBtn.addEventListener("click", () => {
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        togglePwdBtn.textContent = "🙈";
      } else {
        pwdInput.type = "password";
        togglePwdBtn.textContent = "👁️";
      }
    });

    const confirmPwdInput = document.getElementById("auth-confirm-password");
    const toggleConfirmPwdBtn = document.getElementById("toggle-confirm-pwd");
    toggleConfirmPwdBtn.addEventListener("click", () => {
      if (confirmPwdInput.type === "password") {
        confirmPwdInput.type = "text";
        toggleConfirmPwdBtn.textContent = "🙈";
      } else {
        confirmPwdInput.type = "password";
        toggleConfirmPwdBtn.textContent = "👁️";
      }
    });

    // Password live strength validation indicators
    pwdInput.addEventListener("input", validatePasswordStrength);

    function validatePasswordStrength() {
      const val = pwdInput.value;
      const lenOk = val.length >= 8;
      const upperOk = /[A-Z]/.test(val);
      const lowerOk = /[a-z]/.test(val);
      const numOk = /[0-9]/.test(val);
      const specialOk = /[^A-Za-z0-9]/.test(val);

      updateCritIndicator("crit-len", lenOk, "Min 8 characters");
      updateCritIndicator("crit-upper", upperOk, "One uppercase");
      updateCritIndicator("crit-lower", lowerOk, "One lowercase");
      updateCritIndicator("crit-num", numOk, "One number");
      updateCritIndicator("crit-special", specialOk, "One special char");

      // Calculate score and update meter
      const count = [lenOk, upperOk, lowerOk, numOk, specialOk].filter(Boolean).length;
      const meterBar = document.getElementById("pwd-meter-bar");

      meterBar.className = "h-full transition-all duration-300";
      if (count <= 2) {
        meterBar.style.width = "30%";
        meterBar.classList.add("bg-brand-danger");
      } else if (count <= 4) {
        meterBar.style.width = "65%";
        meterBar.classList.add("bg-brand-warning");
      } else {
        meterBar.style.width = "100%";
        meterBar.classList.add("bg-brand-success");
      }
      return count === 5;
    }

    function updateCritIndicator(id, isOk, text) {
      const el = document.getElementById(id);
      if (isOk) {
        el.className = "flex items-center gap-1 text-brand-success";
        el.textContent = "✓ " + text;
      } else {
        el.className = "flex items-center gap-1 text-slate-400";
        el.textContent = "✕ " + text;
      }
    }

    // Confirm password matching validation
    confirmPwdInput.addEventListener("input", validateConfirmPassword);
    function validateConfirmPassword() {
      const matchText = document.getElementById("confirm-pwd-match-text");
      if (confirmPwdInput.value === pwdInput.value) {
        matchText.className = "text-[10px] font-bold mt-1 text-brand-success";
        matchText.textContent = "✓ Passwords match!";
        return true;
      } else {
        matchText.className = "text-[10px] font-bold mt-1 text-brand-danger";
        matchText.textContent = "✕ Passwords do not match.";
        return false;
      }
    }

    // Form Submission Handler (Sign-Up / Login)
    document.getElementById("auth-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const errorBox = document.getElementById("auth-error-box");
      const btnSubmit = document.getElementById("btn-submit");

      errorBox.classList.add("hidden");

      const email = document.getElementById("auth-email").value.trim();
      const password = pwdInput.value;

      if (currentMode === "signup") {
        const name = document.getElementById("auth-name").value.trim();
        const whatsapp = document.getElementById("auth-whatsapp").value.trim();

        // 1. Password parameters validation
        if (!validatePasswordStrength()) {
          errorBox.textContent = "Please fulfill all password strength requirements.";
          errorBox.classList.remove("hidden");
          return;
        }

        // 2. Passwords matching validation
        if (!validateConfirmPassword()) {
          errorBox.textContent = "Passwords do not match.";
          errorBox.classList.remove("hidden");
          return;
        }

        // 3. WhatsApp phone format validation
        if (!/^\+?[0-9]{10,15}$/.test(whatsapp)) {
          errorBox.textContent = "Please enter a valid WhatsApp number (e.g. +923001234567).";
          errorBox.classList.remove("hidden");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Creating account...";

        // Create Firebase Auth user
        auth.createUserWithEmailAndPassword(email, password)
          .then((userCredential) => {
            const user = userCredential.user;
            // Update Auth Profile Name
            return user.updateProfile({ displayName: name }).then(() => {
              // Send verification email immediately
              return user.sendEmailVerification().then(() => {
                // Fetch auth token
                return user.getIdToken();
              });
            }).then((token) => {
              // Register user document cleanly in Firestore via Flask backend
              return fetch(`${AppConfig.API_BASE_URL}/api/v1/auth/signup`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                  fullName: name,
                  email: email,
                  whatsappNumber: whatsapp
                })
              });
            }).then((resp) => {
              if (!resp.ok) {
                return resp.json().then((d) => { throw new Error(d.message || "Failed to save profile."); });
              }
              // Redirect to "Confirm Your Email" status page
              window.location.href = "verify-email.html";
            });
          })
          .catch((error) => {
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Create Account";
            errorBox.textContent = error.message;
            errorBox.classList.remove("hidden");
          });

      } else {
        // Sign-In process flow
        btnSubmit.disabled = true;
        btnSubmit.textContent = "Authenticating...";

        auth.signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            const user = userCredential.user;

            // Immediately verify that email confirmation has been completed
            if (!user.emailVerified) {
              btnSubmit.disabled = false;
              btnSubmit.textContent = "Sign In";
              // Redirect unverified users back to Confirm Your Email page
              window.location.href = "verify-email.html";
              return;
            }

            // Fetch secure Firebase ID Token
            return user.getIdToken().then((token) => {
              // Submit JWT to session check endpoint in Flask backend
              return fetch(`${AppConfig.API_BASE_URL}/api/v1/auth/session`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + token
                }
              });
            }).then((resp) => {
              if (!resp.ok) {
                return resp.json().then((d) => { throw new Error(d.message || "Session check failed."); });
              }
              return resp.json();
            }).then((data) => {
              // Safe verification: user is fully checked and authenticated
              window.location.href = "dashboard.html";
            });
          })
          .catch((error) => {
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Sign In";
            errorBox.textContent = error.message;
            errorBox.classList.remove("hidden");
          });
      }
    });
  </script>
</body>
</html>
